name: Build Executable

on:
  workflow_dispatch:
    inputs:
      executable_kind:
        required: true
        type: string
        description: "client | server"
  workflow_call:
    inputs:
      executable_kind:
        required: true
        type: string
        description: "client | server"

jobs:
  build:
    runs-on: windows-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .

      # OCR (drop + mochila cheia) roda SO no server. Instala o Tesseract na
      # versao que usamos local (5.5.0.20241111) e monta a copia portatil em
      # src/GhostBot/Tesseract-OCR -> o nuitka embute via include-data-dir abaixo.
      # (A pasta e' gitignorada, entao o runner precisa recria-la aqui.)
      - name: Install Tesseract (server only)
        if: inputs.executable_kind == 'server'
        run: choco install tesseract --version=5.5.0.20241111 -y --no-progress

      - name: Build portable Tesseract into the package (server only)
        if: inputs.executable_kind == 'server'
        run: python tools/make_portable_tesseract.py

      - name: compile ${{ inputs.executable_kind }} with nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/GhostBot/run_${{ inputs.executable_kind }}.py
          mode: app
          windows-icon-from-ico: src/GhostBot/Images/logo.ico
          # Images/ (templates BMP + logo) sempre; Tesseract SO no server
          # (client/UI nao faz OCR -> fica leve). 2a linha vira vazia no client.
          include-data-dir: |
            src/GhostBot/Images=GhostBot/Images
            ${{ inputs.executable_kind == 'server' && 'src/GhostBot/Tesseract-OCR=GhostBot/Tesseract-OCR' || '' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.executable_kind }}.exe
          path: build/run_${{ inputs.executable_kind }}.exe
          include-hidden-files: true
          archive: false
